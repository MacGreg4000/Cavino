services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cavemanager
      POSTGRES_USER: cave
      POSTGRES_PASSWORD: ${DB_PASSWORD:-caveau2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cave"]
      interval: 10s
      timeout: 5s
      retries: 5

  cave-api:
    build: ./api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cave:${DB_PASSWORD:-caveau2024}@postgres:5432/cavemanager
      INBOX_PATH: /inbox
      PROCESSED_PATH: /processed
      ERRORS_PATH: /errors
      PHOTOS_PATH: /photos
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SEARXNG_URL: ${SEARXNG_URL:-http://host.docker.internal:8888}
      PORT: 3010
      JWT_SECRET: ${JWT_SECRET:-caveau_jwt_secret_change_me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      # URL publique de l'app (pour les QR codes du PDF) — ex: http://macciolupo.tplinkdns.com
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Inbox (NAS / Docker volume) : polling + scan périodique si le watcher rate des fichiers
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      CHOKIDAR_INTERVAL_MS: ${CHOKIDAR_INTERVAL_MS:-5000}
      INBOX_PERIODIC_SCAN_MS: ${INBOX_PERIODIC_SCAN_MS:-60000}
    volumes:
      - ./data/inbox:/inbox
      - ./data/processed:/processed
      - ./data/errors:/errors
      - wine_photos:/photos
    ports:
      - "${API_PORT:-3010}:3010"

  cave-app:
    build:
      context: ./app
      args:
        VITE_PUBLIC_BASE_URL: ${VITE_PUBLIC_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - cave-api
    ports:
      - "${APP_PORT:-3011}:80"

  cave-scan:
    build: ./cave-scan-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SEARXNG_URL: ${SEARXNG_URL:-http://host.docker.internal:8888}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:8b}
      # Gemini (cloud) en primaire si une clé est fournie — sinon Ollama en local
      # directement. En cas d'échec Gemini (quota dépassé, réseau...), repli
      # automatique sur Ollama à chaque scan, sans configuration supplémentaire.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      CAVE_BASE_DIR: /data/cave
      SETTLE_DELAY: "3.0"
      # Qualité d'analyse — baisser MERGE_MAX_HEIGHT et OLLAMA_NUM_CTX si la VRAM sature
      MERGE_MAX_HEIGHT: ${MERGE_MAX_HEIGHT:-1400}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-24576}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-4096}
      # 2e passe Ollama enrichie du contexte web (0 = désactivé, scans ~2× plus rapides)
      WEB_VERIFY: ${WEB_VERIFY:-1}
    volumes:
      - ./data/inbox:/data/cave
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cave-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: cavemanager
      POSTGRES_USER: cave
      PGPASSWORD: ${DB_PASSWORD:-caveau2024}
    volumes:
      - ./data/backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: >
      sh -c "while true; do
               POSTGRES_USER=cave POSTGRES_DB=cavemanager sh /backup.sh;
               sleep ${BACKUP_INTERVAL:-86400};
             done"

volumes:
  postgres_data:
  wine_photos:
